<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- SEO Meta Tags -->
  <title>Placify CRM | Recruitment Management System</title>
  <meta name="description" content="Placify CRM is a recruitment management system designed to streamline candidate onboarding, recruiter workflows, application tracking, interview coordination, and placement management. Powered by Auriic Services." />
  <meta name="keywords" content="Placify CRM, recruitment management system, candidate tracking, recruiter CRM, placement management, interview coordination, Auriic Services" />
  <meta name="author" content="Auriic Services" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Placify CRM | Recruitment Management System" />
  <meta property="og:description" content="Simplify candidate onboarding, recruiter workflows, interview tracking, and placement management with Placify CRM. Powered by Auriic Services." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://placify.auriic.co/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Placify CRM | Recruitment Management System" />
  <meta name="twitter:description" content="Placify CRM streamlines candidate tracking, recruiter workflows, interview coordination, and placement management. Powered by Auriic Services." />
  <!-- Performance: Preconnect & Fast Font Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" />
</head>
<body style="background-color: #0A0C10; margin: 0;">
  <div id="root">
    <div id="app-shell-preloader" style="min-height: 100vh; background-color: #0A0C10; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: rgba(0, 173, 140, 0.12); border: 1px solid rgba(0, 173, 140, 0.25); display: flex; align-items: center; justify-content: center;">
          <div style="width: 22px; height: 22px; border: 3px solid rgba(0, 173, 140, 0.2); border-top-color: #00AD8C; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: -0.02em;">Placify CRM</span>
          <span style="color: #718096; font-size: 11px; font-weight: 500;">Loading workspace...</span>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
